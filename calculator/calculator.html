<!DOCTYPE html>
<html>
<head>

    <title>SpiderCalc</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="calculator">

        <h1>🕷 SpiderCalc</h1>

        <input type="text" id="display" readonly>

        <div class="buttons">

           <button>%</button>
<button>CE</button>
<button>C</button>
<button>⌫</button>

<button>1/x</button>
<button>x²</button>
<button>√</button>
<button class="operator">+</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">-</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">×</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">÷</button>

<button>±</button>
<button>0</button>
<button>.</button>
<button class="operator">=</button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
